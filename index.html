<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daveedus">
<meta name="theme-color" id="themecolor" content="#0a1220">
<title>Daveedus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="screen"></main>
</div>
<nav id="tabbar"><div class="inner" id="tabinner"></div></nav>
<div id="modal"><div class="sheet" id="modalsheet"></div></div>
<div id="stepper">
  <button data-d="-2.5">−2.5</button>
  <span class="steptime" id="step-time"></span>
  <button data-d="2.5">+2.5</button>
</div>
<div id="toast"></div>
<!-- Classic scripts, order matters: data -> strings -> helpers -> state ->
     render core -> screens -> import/export -> boot. Everything is global by
     design (inline onclick handlers resolve against global scope). -->
<script src="js/exercises.js"></script>
<script src="js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/home.js"></script>
<script src="js/deload.js"></script>
<script src="js/workout.js"></script>
<script src="js/program.js"></script>
<script src="js/exercises-ui.js"></script>
<script src="js/stats.js"></script>
<script src="js/history.js"></script>
<script src="js/settings.js"></script>
<script src="js/data.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
